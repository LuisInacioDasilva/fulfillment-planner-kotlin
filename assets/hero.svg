<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="t d"><title id="t">Fulfillment Planner</title><desc id="d">Banner roxo animado com fluxo entre pedidos, regras e estoque.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101322"/><stop offset="1" stop-color="#38305d"/></linearGradient><pattern id="g" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#bd9cff" stroke-opacity=".12"/></pattern><style>.ey{font:700 12px monospace;letter-spacing:4px;fill:#c9b4ff}.title{font:800 58px Arial,sans-serif;letter-spacing:-4px;fill:#f4f1ff}.sub{font:400 18px Arial,sans-serif;fill:#c8c3da}.line{stroke-dasharray:7 11;animation:flow 5s linear infinite}.pulse{animation:pulse 2.5s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-108}}@keyframes pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1200" height="270" rx="18" fill="url(#bg)"/><rect width="1200" height="270" rx="18" fill="url(#g)"/><text x="68" y="68" class="ey">KOTLIN / RULES / ALLOCATION</text><text x="68" y="145" class="title">FULFILLMENT</text><text x="68" y="204" class="title" fill="#bd9cff">PLANNER<tspan fill="#ffc781">.</tspan></text><path class="line" d="M700 135H825M925 135H1030" fill="none" stroke="#bd9cff" stroke-width="3"/><rect x="825" y="90" width="100" height="90" rx="8" fill="#312b51" stroke="#bd9cff"/><text x="844" y="143" font="700 13px monospace" fill="#d4c2ff">POLICY</text><circle class="pulse" cx="1058" cy="135" r="44" fill="#bd9cff" fill-opacity=".15" stroke="#bd9cff"/><path d="m1038 135 14 14 27-31" fill="none" stroke="#9be6c3" stroke-width="6"/></svg>
